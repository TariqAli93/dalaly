name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The app ships for Windows only; build and test where it runs.
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # typecheck, unit tests and builds never launch Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Fast suites only; they blank DB settings and need no PostgreSQL.
      - run: pnpm test
      - run: pnpm build
