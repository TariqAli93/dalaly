      - name: test:transactions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @dalaly/server test:transactions
      - name: test:restore:large
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @dalaly/server test:restore:large
      - name: test:paging
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @dalaly/server test:paging
      - name: test:thumbnails
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @dalaly/server test:thumbnails
      - name: test:files
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
